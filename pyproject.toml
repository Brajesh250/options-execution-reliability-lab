[project]
name = "options-execution-reliability-lab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40", "plotly>=5.24", "pandas>=2.2", "numpy>=2.0", "sqlalchemy>=2.0", "fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.coverage.run]
source = ["src/domain", "src/simulation", "src/analytics"]

[tool.coverage.report]
fail_under = 80
show_missing = true
